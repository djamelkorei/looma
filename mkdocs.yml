site_name: Looma
site_description: Blade-style template engine for Spring Boot
site_url: https://djamelkorei.github.io/looma/
repo_url: https://github.com/djamelkorei/looma
repo_name: djamelkorei/looma
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Djamel Eddine Korei. Apache License 2.0.

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/djamelkorei/looma
    - icon: fontawesome/solid/cube
      link: https://central.sonatype.com/artifact/io.github.djamelkorei/looma-spring-boot-starter
      name: Maven Central

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Guide:
      - Installation: installation.md
      - Getting started: getting-started.md
      - Migrating from Thymeleaf: thymeleaf-migration.md
      - IntelliJ plugin: intellij.md
  - Reference:
      - Template syntax: syntax.md
      - Configuration: configuration.md
      - Security & operations: security.md
      - Extending & architecture: extending.md
  - Compare:
      - Looma vs Thymeleaf: comparison.md
      - Benchmarks: benchmarks.md
  - Project:
      - Releasing: releasing.md
      - Changelog: https://github.com/djamelkorei/looma/blob/main/CHANGELOG.md
