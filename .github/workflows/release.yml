name: Release

# Runs when a GitHub release is published (tag like v0.1.0). The version is taken from the tag.
# See docs/releasing.md for the one-time setup (Central Portal account, signing key, secrets).
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  maven-central:
    name: Upload to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
      - name: Set version from the release tag
        run: mvn -B -q versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - name: Test, sign and upload
        run: mvn -B -Prelease,central deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Set version from the release tag
        run: mvn -B -q versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - name: Test and deploy
        # GitHub Packages refuses to overwrite a version (HTTP 409). When a release is re-run, an existing copy is
        # kept and reported as a warning instead of failing the release.
        run: |
          set +e
          mvn -B -Prelease deploy 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && grep -q "409" deploy.log; then
            echo "::warning::This version is already in GitHub Packages; kept the existing copy."
            exit 0
          fi
          exit "$status"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
