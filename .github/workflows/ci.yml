name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Every supported Java x Spring Boot combination runs the full test suite.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
        boot: [3.3.13, 3.4.13, 3.5.16, 4.0.8]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test against Spring Boot ${{ matrix.boot }}
        run: mvn -B verify -Dspring-boot.version=${{ matrix.boot }}

  # Sources + javadoc jars must build too.
  release-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -Prelease verify
